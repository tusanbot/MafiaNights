name: Repair substitute names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix substitute identity merge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runtime/management_navigation.py')
          text = p.read_text(encoding='utf-8')
          old = '''        if row.get("seat") is None and str(row.get("status") or "") in {"waiting", "substitute"} and bool(row.get("is_substitute", False)):\n            merged[uid] = row\n    return list(merged.values())'''
          new = '''        if row.get("seat") is None and str(row.get("status") or "") in {"waiting", "substitute"} and bool(row.get("is_substitute", False)):\n            existing = merged.get(uid, {})\n            for key in ("nickname", "first_name", "last_name", "username", "name"):\n                if row.get(key):\n                    existing[key] = row[key]\n            existing["player_id"] = uid\n            existing["seat"] = row.get("seat")\n            existing["status"] = row.get("status") or existing.get("status") or "waiting"\n            existing["is_substitute"] = True\n            merged[uid] = existing\n    return list(merged.values())'''
          if old not in text:
              raise SystemExit('expected substitute merge block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/repair-substitute-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/management_navigation.py .github/workflows/repair-substitute-names.yml
          git commit -m "preserve substitute display names in management"
          git push
