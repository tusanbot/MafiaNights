name: Repair replacement flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply replacement fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  print(f'pattern not found: {path}')
                  return False
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'updated: {path}')
              return True

          changed = False

          changed |= replace(
              'runtime/feature_parity.py',
              '        await self._save_state(group_id, substitutes=subs)\n        await message.reply',
              '        self._save_state(group_id, substitutes=subs)\n        await message.reply',
          )

          changed |= replace(
              'runtime/management_navigation.py',
              '                merged[uid] = row\n    return list(merged.values())',
              '                existing = merged.get(uid, {})\n                for key in ("nickname", "first_name", "last_name", "username", "name"):\n                    if row.get(key):\n                        existing[key] = row[key]\n                existing["player_id"] = uid\n                existing["seat"] = row.get("seat")\n                existing["status"] = row.get("status") or existing.get("status") or "waiting"\n                existing["is_substitute"] = True\n                merged[uid] = existing\n    return list(merged.values())',
          )

          changed |= replace(
              'runtime/management_navigation.py',
              '            self.app.runtime.state.games.set_player_status(game["id"], target_id, "removed")\n',
              '            self.app.runtime.state.games.set_player_status(game["id"], target_id, "substituted")\n',
          )

          changed |= replace(
              'runtime/management_navigation.py',
              '                self.app.runtime.state.lobby.join(game["group_chat_id"], substitute_id, seat, is_substitute=False)\n',
              '                self.app.runtime.state.lobby.join(game["id"], substitute_id, seat, is_substitute=False)\n',
          )

          changed |= replace(
              'runtime/production_lobby.py',
              '        lines = [\n            "༄ <b>لیست بازی Mafia Nights</b>", "",\n            f"📅 <b>تاریخ:</b> {datetime.now(ZoneInfo(\'Asia/Tehran\')).strftime(\'%Y/%m/%d\')}",\n            f"🎭 <b>سناریو:</b> {html.escape(scenario_name(game.get(\'scenario_id\')))}",\n            f"🔢 <b>شماره بازی:</b> {int(game.get(\'event_number\') or 1)}",\n            f"🎩 <b>گرداننده:</b> {mention(int(game[\'moderator_id\']))}", "",',
              '        moderator_id = int(game["moderator_id"])\n        moderator_row = next((r for r in rows if int(r.get("player_id") or 0) == moderator_id), None)\n        moderator_name = player_name(moderator_row) if moderator_row else None\n        if not moderator_name or moderator_name == str(moderator_id):\n            try:\n                moderator_member = await bot.get_chat_member(gid, moderator_id)\n                moderator_name = moderator_member.user.full_name or moderator_member.user.username or str(moderator_id)\n            except Exception:\n                moderator_name = str(moderator_id)\n\n        lines = [\n            "༄ <b>لیست بازی Mafia Nights</b>", "",\n            f"📅 <b>تاریخ:</b> {datetime.now(ZoneInfo(\'Asia/Tehran\')).strftime(\'%Y/%m/%d\')}",\n            f"🎭 <b>سناریو:</b> {html.escape(scenario_name(game.get(\'scenario_id\')))}",\n            f"🔢 <b>شماره بازی:</b> {int(game.get(\'event_number\') or 1)}",\n            f"🎩 <b>گرداننده:</b> {mention(moderator_id, moderator_name)}", "",',
          )

          # Make legacy LobbyService.join tolerant of callers that accidentally pass group_chat_id.
          changed |= replace(
              'services/lobby_service.py',
              '    def join(self, game_id: str, player_id: int, seat: Optional[int] = None, is_substitute: bool = False) -> int: return self.repository.add_player(game_id=game_id, player_id=player_id, seat=seat, status="waiting" if seat is None else "active", is_substitute=is_substitute)\n',
              '    def join(self, game_id: str, player_id: int, seat: Optional[int] = None, is_substitute: bool = False) -> int:\n        resolved_game_id = int(game_id)\n        # Backward compatibility: older handlers passed group_chat_id here.\n        active = self.repository.get_active_game(int(game_id))\n        if active:\n            resolved_game_id = int(active["id"])\n        return self.repository.add_player(game_id=resolved_game_id, player_id=player_id, seat=seat, status="waiting" if seat is None else "active", is_substitute=is_substitute)\n',
          )

          if changed:
              print('replacement repairs applied')
          else:
              print('no changes required')
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/feature_parity.py runtime/management_navigation.py runtime/production_lobby.py services/lobby_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix replacement identity and lobby membership flow"
          git push
