name: Fix round engine wiring

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[round-engine-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch round/challenge wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('runtime/stable_round_engine.py')
          s = p.read_text(encoding='utf-8')

          old = '''        "_stable_challenge_request_messages": {},\n    }'''
          new = '''        "_stable_challenge_request_messages": {},\n        "_gm_extra_next_round": set(),\n        "_gm_muted_next_round": set(),\n        "_gm_muted_active": set(),\n        "_gm_extra_phase": False,\n        "_gm_extra_turn_active": False,\n        "_gm_extra_seats": set(),\n        "_gm_normal_order": [],\n        "challenge_active": True,\n    }'''
          if old not in s:
              raise SystemExit('stable defaults anchor not found')
          s = s.replace(old, new, 1)

          old = '''        main.challenge_mode = False\n        main.pending_challenges = {}\n        main.active_challenger_seats = set()\n        main.turn_order = list(base)'''
          new = '''        main.challenge_active = bool(getattr(main, "challenge_enabled", {}).get(_gid(main), True))\n        main.challenge_mode = False\n        main.pending_challenges = {}\n        main.active_challenger_seats = set()\n        main.turn_order = list(base)'''
          if old not in s:
              raise SystemExit('start round challenge anchor not found')
          s = s.replace(old, new, 1)

          old = '''        main._gm_normal_order = list(base)\n        await _advance(main)'''
          new = '''        main._gm_normal_order = list(base)\n        roster = []\n        for seat in base:\n            uid = _uid(main, seat)\n            name = await _resolve_name(main, uid)\n            roster.append(f"{int(seat):02d}. <a href=\\"tg://user?id={int(uid)}\\">{html.escape(name)}</a>")\n        if roster:\n            await main.bot.send_message(\n                _gid(main),\n                "📋 <b>لیست بازیکنان</b>\\n\\n" + "\\n".join(roster),\n                parse_mode="HTML",\n            )\n        await _advance(main)'''
          if old not in s:
              raise SystemExit('roster anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('runtime/role_distribution.py')
          s = p.read_text(encoding='utf-8')
          old = '''    app.challenge_mode = False\n    app.pending_challenges = {}'''
          new = '''    app.challenge_active = bool(getattr(app, "challenge_enabled", {}).get(int(group_id), True))\n    app.challenge_mode = False\n    app.pending_challenges = {}'''
          if old not in s:
              raise SystemExit('role distribution challenge anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('runtime/game_management.py')
          s = p.read_text(encoding='utf-8')
          old = '''        self.app.challenge_enabled[gid] = not self.app.challenge_enabled.get(gid, True)\n        await callback.answer("⚔ وضعیت چالش تغییر کرد.")'''
          new = '''        self.app.challenge_enabled[gid] = not self.app.challenge_enabled.get(gid, True)\n        self.app.challenge_active = self.app.challenge_enabled[gid]\n        await callback.answer("⚔ وضعیت چالش تغییر کرد.")'''
          if old not in s:
              raise SystemExit('management challenge anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('main_refactored.py')
          s = p.read_text(encoding='utf-8')
          old = '''    async def toggle_challenge(self, callback): self.challenge_enabled[int(callback.message.chat.id)] = not self.challenge_enabled.get(int(callback.message.chat.id), True); await callback.answer("⚔ چالش " + ("روشن شد." if self.challenge_enabled[int(callback.message.chat.id)] else "خاموش شد."))'''
          new = '''    async def toggle_challenge(self, callback):\n        gid = int(callback.message.chat.id)\n        self.challenge_enabled[gid] = not self.challenge_enabled.get(gid, True)\n        self.challenge_active = self.challenge_enabled[gid]\n        await callback.answer("⚔ چالش " + ("روشن شد." if self.challenge_enabled[gid] else "خاموش شد."))'''
          if old not in s:
              raise SystemExit('main toggle anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/stable_round_engine.py runtime/role_distribution.py runtime/game_management.py main_refactored.py
          git commit -m "fix round engine challenge and turn flow [round-engine-fix]"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-round-engine.yml
          git commit -m "remove temporary round engine patch workflow [round-engine-fix]"
          git push
